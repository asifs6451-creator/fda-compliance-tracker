<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FDA Compliance Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --navy: #1a2e4a; }
    body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
    .login-card { width: 100%; max-width: 400px; }
    .login-header { background: var(--navy); border-radius: 12px 12px 0 0; padding: 32px 28px 24px; text-align: center; }
    .login-body { background: white; border-radius: 0 0 12px 12px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,.1); }
    .form-control { border-radius: 8px; border-color: #e2e8f0; padding: .6rem .85rem; }
    .form-control:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26,46,74,.12); }
    .btn-login { background: var(--navy); border-color: var(--navy); border-radius: 8px; padding: .65rem; font-weight: 600; letter-spacing: .3px; }
    .btn-login:hover { background: #243c60; border-color: #243c60; }
    .role-badge { display: inline-block; padding: .15rem .5rem; border-radius: 50px; font-size: .7rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <i class="fas fa-shield-halved text-white fa-2x mb-2"></i>
      <h5 class="text-white fw-bold mb-1">FDA Compliance Tracker</h5>
      <p class="text-white-50 small mb-0">Daily Warehouse Compliance Monitor</p>
    </div>
    <div class="login-body">
      <div id="errorAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted fa-sm"></i></span>
            <input type="text" class="form-control border-start-0 ps-1" id="username"
              placeholder="Enter username" autocomplete="username" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted fa-sm"></i></span>
            <input type="password" class="form-control border-start-0 ps-1" id="password"
              placeholder="Enter password" autocomplete="current-password" required>
            <button type="button" class="input-group-text bg-light" id="togglePwd">
              <i class="fas fa-eye text-muted fa-sm"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login w-100" id="loginBtn">
          <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
          <i class="fas fa-sign-in-alt me-2" id="loginIcon"></i>Sign In
        </button>
      </form>
      <div class="mt-3 text-center text-muted" style="font-size:.75rem">
        Contact your administrator to reset your password
      </div>
    </div>
  </div>
  <script>
    document.getElementById('togglePwd').addEventListener('click', () => {
      const inp = document.getElementById('password');
      const ico = document.querySelector('#togglePwd i');
      if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fas fa-eye-slash text-muted fa-sm'; }
      else { inp.type = 'password'; ico.className = 'fas fa-eye text-muted fa-sm'; }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');
      const icon = document.getElementById('loginIcon');
      const err = document.getElementById('errorAlert');
      err.classList.add('d-none');
      btn.disabled = true; spinner.classList.remove('d-none'); icon.classList.add('d-none');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        // Redirect based on role
        const u = data.user;
        if (u.role === 'pharmacist' && u.warehouse_id) {
          location.href = `/checklist.html?id=${u.warehouse_id}`;
        } else {
          location.href = '/';
        }
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('d-none');
        btn.disabled = false; spinner.classList.add('d-none'); icon.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
