<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Review — FDA Compliance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">

<nav class="navbar navbar-dark shadow sticky-top" style="background:var(--navy)">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center gap-3">
      <a href="/" class="btn btn-sm btn-outline-light rounded-circle"><i class="fas fa-arrow-left"></i></a>
      <span class="navbar-brand fw-bold mb-0"><i class="fas fa-images me-2"></i>Evidence Image Review</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-warning text-dark" id="pendingCount">0 Pending</span>
      <button class="btn btn-sm btn-outline-light" onclick="loadPending()"><i class="fas fa-rotate"></i></button>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-3">
  <div class="alert alert-info small py-2 mb-3">
    <i class="fas fa-info-circle me-2"></i>
    Review photos uploaded by pharmacists. <strong>Approve</strong> if the evidence is clear and valid.
    <strong>Reject</strong> with a reason if the photo is unclear, incorrect, or needs to be re-uploaded.
  </div>

  <!-- Filter bar -->
  <div class="d-flex gap-2 mb-3 flex-wrap">
    <select class="form-select form-select-sm" style="max-width:200px" id="filterLocation" onchange="applyFilter()">
      <option value="">All Locations</option>
    </select>
    <select class="form-select form-select-sm" style="max-width:180px" id="filterStatus" onchange="applyFilter()">
      <option value="pending">Pending Review</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
      <option value="">All</option>
    </select>
    <span class="ms-auto text-muted small align-self-center" id="resultCount"></span>
  </div>

  <div class="row g-3" id="reviewGrid">
    <div class="col-12 text-center py-5 text-muted">
      <i class="fas fa-spinner fa-spin fa-2x d-block mb-3"></i>Loading…
    </div>
  </div>
</div>

<!-- Reject reason modal -->
<div class="modal fade" id="rejectModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title">Rejection Reason</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="rejectUploadId">
        <textarea class="form-control" id="rejectNotes" rows="3" placeholder="e.g. Image unclear, please re-upload with better lighting"></textarea>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-sm btn-danger" onclick="submitReject()">Reject</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1200">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-semibold" id="toastMsg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/review.js"></script>
</body>
</html>
